<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>KK 1 Gram Jewellers | Premium 1 Gram Jewellery</title>

  <meta
    name="description"
    content="KK 1 Gram Jewellers - Premium 1 Gram Jewellery collections in Mehsana, Palanpur and Kalol."
  >

  <style>

    /* =====================================================
       RESET
    ====================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f8f6f1;
      color: #171717;
      line-height: 1.6;
    }

    body.modal-open {
      overflow: hidden;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    /* =====================================================
       COLORS
    ====================================================== */

    :root {
      --black: #0d0d0d;
      --black-2: #171717;
      --gold: #c9a227;
      --gold-light: #efd477;
      --cream: #f8f6f1;
      --white: #ffffff;
      --text: #1c1c1c;
      --muted: #777777;
      --border: #e5dfd2;
      --green: #25D366;
    }

    /* =====================================================
       NAVBAR
    ====================================================== */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 9999;

      width: 100%;

      background: rgba(13, 13, 13, 0.97);

      border-bottom: 1px solid rgba(201, 162, 39, 0.25);

      padding: 12px 5%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.18);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;

      color: var(--gold-light);

      font-size: 20px;
      font-weight: 800;

      letter-spacing: 1px;
    }

    .logo img {
      width: 45px;
      height: 45px;

      border-radius: 8px;

      object-fit: cover;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      color: white;

      font-size: 14px;
      font-weight: 600;

      transition: 0.3s;
    }

    .nav-links a:hover {
      color: var(--gold-light);
    }

    /* =====================================================
       HERO
    ====================================================== */

    .hero {
      width: 100%;
      background: #111;

      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: auto;

      object-fit: cover;
    }

    /* =====================================================
       INTRO
    ====================================================== */

    .intro {
      text-align: center;

      max-width: 900px;

      margin: auto;

      padding: 70px 20px 45px;
    }

    .intro-label {
      color: #b08a1e;

      font-size: 13px;
      font-weight: 800;

      letter-spacing: 5px;

      margin-bottom: 12px;
    }

    .intro h1 {
      font-size: clamp(32px, 5vw, 55px);

      line-height: 1.1;

      margin-bottom: 16px;

      color: #171717;
    }

    .intro p {
      max-width: 700px;

      margin: auto;

      color: #777;

      font-size: 16px;
    }

    /* =====================================================
       COMMON SECTION
    ====================================================== */

    .section {
      padding: 75px 6%;
    }

    .section-heading {
      text-align: center;

      margin-bottom: 45px;
    }

    .section-heading .eyebrow {
      color: #b08a1e;

      font-size: 13px;
      font-weight: 800;

      letter-spacing: 4px;

      margin-bottom: 8px;
    }

    .section-heading h2 {
      font-size: clamp(30px, 4vw, 44px);

      line-height: 1.2;

      margin-bottom: 12px;
    }

    .section-heading p {
      color: var(--muted);

      font-size: 15px;
    }

    .gold-line {
      width: 70px;
      height: 3px;

      background: var(--gold);

      margin: 18px auto 0;
    }

    /* =====================================================
       COLLECTION CARDS
    ====================================================== */

    .collection-grid {
      max-width: 1200px;

      margin: auto;

      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 22px;
    }

    .collection-card {
      position: relative;

      min-height: 310px;

      overflow: hidden;

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          #111,
          #292929
        );

      border: 1px solid rgba(201, 162, 39, 0.45);

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.12);

      cursor: pointer;

      transition: 0.4s ease;
    }

    .collection-card:hover {
      transform: translateY(-8px);

      box-shadow:
        0 22px 50px rgba(0, 0, 0, 0.22);
    }

    .collection-card::before {
      content: "";

      position: absolute;

      width: 260px;
      height: 260px;

      border-radius: 50%;

      background: rgba(201, 162, 39, 0.08);

      top: -110px;
      right: -90px;
    }

    .collection-card::after {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      border-radius: 50%;

      background: rgba(201, 162, 39, 0.05);

      bottom: -90px;
      left: -70px;
    }

    .collection-content {
      position: relative;

      z-index: 2;

      height: 100%;

      min-height: 310px;

      padding: 30px;

      display: flex;

      flex-direction: column;

      justify-content: flex-end;
    }

    .collection-icon {
      font-size: 48px;

      margin-bottom: auto;
    }

    .collection-content h3 {
      color: var(--gold-light);

      font-size: 23px;

      letter-spacing: 2px;

      margin-bottom: 7px;
    }

    .collection-content p {
      color: #d2d2d2;

      font-size: 14px;

      margin-bottom: 20px;
    }

    .collection-btn {
      width: fit-content;

      border: 1px solid var(--gold);

      color: white;

      padding: 9px 17px;

      border-radius: 30px;

      font-size: 13px;

      font-weight: 700;

      transition: 0.3s;
    }

    .collection-card:hover .collection-btn {
      background: var(--gold);

      color: #111;
    }

    /* =====================================================
       PRODUCTS
    ====================================================== */

    .products-section {
      background: #fff;

      display: none;
    }

    .products-section.show {
      display: block;
    }

    .selected-collection-info {
      text-align: center;

      margin-bottom: 35px;
    }

    .back-to-collections {
      display: inline-flex;

      align-items: center;

      gap: 7px;

      border: 1px solid var(--gold);

      color: #8d6b10;

      background: transparent;

      padding: 9px 17px;

      border-radius: 30px;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.3s;
    }

    .back-to-collections:hover {
      background: var(--gold);

      color: #111;
    }

    .product-category {
      max-width: 1200px;

      margin: auto;

      display: none;
    }

    .product-category.active {
      display: block;

      animation: fadeCollection 0.45s ease;
    }

    @keyframes fadeCollection {

      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    .category-heading {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 22px;

      padding-bottom: 12px;

      border-bottom: 1px solid var(--border);
    }

    .category-heading h3 {
      font-size: 25px;

      letter-spacing: 1px;
    }

    .category-heading span {
      color: #a67e12;

      font-size: 13px;

      font-weight: 700;
    }

    .product-grid {
      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 20px;
    }

    /* =====================================================
       PRODUCT CARD
    ====================================================== */

    .product-card {
      background: white;

      border: 1px solid #e8e3da;

      border-radius: 16px;

      overflow: hidden;

      cursor: pointer;

      transition: 0.35s ease;

      box-shadow:
        0 7px 25px rgba(0, 0, 0, 0.06);
    }

    .product-card:hover {
      transform: translateY(-7px);

      box-shadow:
        0 17px 38px rgba(0, 0, 0, 0.13);
    }

    .product-image {
      position: relative;

      height: 280px;

      background: #f7f4ed;

      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;

      object-fit: contain;

      padding: 12px;

      transition: transform 0.45s ease;
    }

    .product-card:hover .product-image img {
      transform: scale(1.05);
    }

    .product-tag {
      position: absolute;

      top: 12px;
      left: 12px;

      background: #111;

      color: var(--gold-light);

      padding: 5px 9px;

      border-radius: 20px;

      font-size: 10px;

      font-weight: 800;

      letter-spacing: 1px;

      z-index: 2;
    }

    .product-info {
      padding: 17px;
    }

    .product-info h4 {
      font-size: 17px;

      margin-bottom: 5px;
    }

    .product-info p {
      color: #888;

      font-size: 12px;

      margin-bottom: 13px;
    }

    .view-product {
      color: #a57d13;

      font-size: 13px;

      font-weight: 800;
    }

    /* =====================================================
       PRODUCT MODAL
    ====================================================== */

    .product-modal {
      position: fixed;

      inset: 0;

      z-index: 20000;

      background: rgba(0, 0, 0, 0.78);

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;
    }

    .product-modal.active {
      display: flex;
    }

    .modal-box {
      position: relative;

      width: min(1050px, 100%);

      max-height: 92vh;

      overflow-y: auto;

      background: #fff;

      border-radius: 22px;

      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.4);

      display: grid;

      grid-template-columns: 1.1fr 0.9fr;

      overflow: hidden;
    }

    .modal-close {
      position: absolute;

      right: 15px;
      top: 15px;

      width: 40px;
      height: 40px;

      border: none;

      border-radius: 50%;

      background: #111;

      color: white;

      font-size: 20px;

      cursor: pointer;

      z-index: 5;
    }

    .modal-gallery {
      background: #f5f2eb;

      padding: 30px;

      min-height: 550px;

      display: flex;

      flex-direction: column;

      justify-content: center;
    }

    .main-product-image {
      width: 100%;

      height: 450px;

      object-fit: contain;
    }

    .thumbnail-row {
      display: flex;

      gap: 10px;

      margin-top: 18px;

      overflow-x: auto;
    }

    .thumbnail {
      width: 70px;
      height: 70px;

      flex: 0 0 70px;

      object-fit: cover;

      border-radius: 9px;

      border: 2px solid transparent;

      cursor: pointer;

      background: white;
    }

    .thumbnail.active {
      border-color: var(--gold);
    }

    .modal-details {
      padding: 55px 45px;

      display: flex;

      flex-direction: column;

      justify-content: center;
    }

    .modal-label {
      color: #b08a1e;

      font-size: 12px;

      font-weight: 800;

      letter-spacing: 3px;

      margin-bottom: 10px;
    }

    .modal-details h2 {
      font-size: 34px;

      line-height: 1.2;

      margin-bottom: 12px;
    }

    .modal-description {
      color: #777;

      font-size: 15px;

      margin-bottom: 25px;
    }

    .detail-list {
      list-style: none;

      margin-bottom: 28px;
    }

    .detail-list li {
      padding: 8px 0;

      border-bottom: 1px solid #eee;

      color: #555;

      font-size: 14px;
    }

    .detail-list strong {
      color: #222;
    }

    .whatsapp-product {
      display: inline-flex;

      justify-content: center;

      align-items: center;

      gap: 8px;

      background: var(--green);

      color: white;

      padding: 13px 22px;

      border-radius: 8px;

      font-size: 14px;

      font-weight: 800;

      transition: 0.3s;
    }

    .whatsapp-product:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 20px rgba(37, 211, 102, 0.25);
    }

    /* =====================================================
       WHY US
    ====================================================== */

    .why-section {
      background: #111;

      color: white;
    }

    .why-section .section-heading h2 {
      color: white;
    }

    .why-section .section-heading p {
      color: #aaa;
    }

    .why-grid {
      max-width: 1100px;

      margin: auto;

      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 22px;
    }

    .why-card {
      padding: 35px 25px;

      text-align: center;

      border-radius: 16px;

      border: 1px solid rgba(201, 162, 39, 0.35);

      background: rgba(255, 255, 255, 0.025);
    }

    .why-icon {
      font-size: 38px;

      margin-bottom: 15px;
    }

    .why-card h3 {
      color: var(--gold-light);

      margin-bottom: 8px;
    }

    .why-card p {
      color: #aaa;

      font-size: 14px;
    }

    /* =====================================================
       SHOWROOMS
    ====================================================== */

    .stores {
      background: var(--cream);
    }

    .store-grid {
      max-width: 1150px;

      margin: auto;

      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 22px;
    }

    .store-card {
      background: white;

      padding: 30px;

      border-radius: 16px;

      border: 1px solid var(--border);

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.05);

      transition: 0.3s;
    }

    .store-card:hover {
      transform: translateY(-6px);

      box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.1);
    }

    .store-card h3 {
      font-size: 23px;

      margin-bottom: 12px;
    }

    .store-card h3 span {
      color: var(--gold);
    }

    .store-card p {
      color: #666;

      font-size: 14px;

      margin-bottom: 20px;
    }

    .store-buttons {
      display: flex;

      gap: 8px;

      flex-wrap: wrap;
    }

    .store-btn {
      display: inline-block;

      background: #111;

      color: white;

      padding: 9px 15px;

      border-radius: 7px;

      font-size: 13px;

      font-weight: 700;

      transition: 0.3s;
    }

    .store-btn:hover {
      background: var(--gold);

      color: #111;
    }

    /* =====================================================
       CONTACT
    ====================================================== */

    .contact {
      background: #111;

      color: white;

      text-align: center;

      padding: 75px 20px;
    }

    .contact h2 {
      color: var(--gold-light);

      font-size: clamp(30px, 4vw, 42px);

      margin-bottom: 12px;
    }

    .contact p {
      color: #bbb;

      margin-bottom: 25px;
    }

    .contact-btn {
      display: inline-flex;

      align-items: center;

      gap: 8px;

      background: var(--green);

      color: white;

      padding: 13px 25px;

      border-radius: 8px;

      font-weight: 800;
    }

    /* =====================================================
       FOOTER
    ====================================================== */

    footer {
      background: #070707;

      text-align: center;

      color: #888;

      padding: 28px 15px;

      font-size: 13px;
    }

    footer strong {
      color: var(--gold);
    }

    /* =====================================================
       FLOATING WHATSAPP
    ====================================================== */

    .whatsapp-float {
      position: fixed;

      right: 20px;
      bottom: 20px;

      width: 58px;
      height: 58px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      background: var(--green);

      color: white;

      font-size: 27px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.25);

      z-index: 15000;

      transition: 0.3s;
    }

    .whatsapp-float:hover {
      transform: scale(1.1);
    }

    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 1100px) {

      .collection-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .product-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .modal-box {
        grid-template-columns: 1fr;
      }

      .modal-gallery {
        min-height: auto;
      }

      .main-product-image {
        height: 400px;
      }

    }

    @media (max-width: 800px) {

      .product-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .why-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .store-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 650px) {

      .navbar {
        padding: 10px 14px;
      }

      .logo {
        font-size: 12px;

        gap: 7px;
      }

      .logo img {
        width: 36px;
        height: 36px;
      }

      .nav-links {
        gap: 9px;
      }

      .nav-links a {
        font-size: 10px;
      }

      .intro {
        padding: 50px 18px 35px;
      }

      .section {
        padding: 55px 18px;
      }

      .collection-grid {
        grid-template-columns: 1fr;

        gap: 18px;
      }

      .collection-card {
        min-height: 240px;
      }

      .collection-content {
        min-height: 240px;

        padding: 28px;
      }

      .product-grid {
        grid-template-columns: 1fr 1fr;

        gap: 12px;
      }

      .product-image {
        height: 190px;
      }

      .product-info {
        padding: 12px;
      }

      .product-info h4 {
        font-size: 14px;
      }

      .product-info p {
        font-size: 11px;
      }

      .category-heading h3 {
        font-size: 20px;
      }

      .category-heading span {
        font-size: 10px;
      }

      .why-grid {
        grid-template-columns: 1fr;
      }

      .store-grid {
        grid-template-columns: 1fr;
      }

      .modal-box {
        max-height: 95vh;

        border-radius: 15px;
      }

      .modal-gallery {
        padding: 18px;
      }

      .main-product-image {
        height: 300px;
      }

      .modal-details {
        padding: 28px 22px;
      }

      .modal-details h2 {
        font-size: 27px;
      }

      .whatsapp-float {
        width: 52px;
        height: 52px;

        right: 15px;
        bottom: 15px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       NAVBAR
  ====================================================== -->

  <nav class="navbar">

    <a href="#" class="logo">

      <img
        src="kk-logo.jpg"
        alt="KK 1 Gram Jewellers Logo"
      >

      <span>KK 1 GRAM JEWELLERS</span>

    </a>


    <div class="nav-links">

      <a href="#collections">
        Collections
      </a>

      <a href="#products">
        Jewellery
      </a>

      <a href="#stores">
        Branches
      </a>

      <a href="#contact">
        Contact
      </a>

    </div>

  </nav>


  <!-- =====================================================
       HERO
  ====================================================== -->

  <header class="hero">

    <img
      src="banner.jpg.jpg"
      alt="KK 1 Gram Jewellers Premium Jewellery"
    >

  </header>
